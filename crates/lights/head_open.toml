[[entry]]
id = "L-177"
title = "the coverage plane stores one scalar in three channels, which is 15.82 MiB of a 47.46 MiB f32 frame at 1080p"
area = "core"
kind = "cleanup"
state = "absent"
status = "open"
raised = "2026-09-29"
size = "small"
cluster = "frame-memory"
where = "crates/lights/src/draw.rs:496 (coverage[at] = Rgb::splat(a + coverage[at].x * keep), in composite since L-175; this field said draw.rs:430 coverage.set(px, py, Rgb::splat(covered)) until L-175 moved the loop into the banded kernel on 2026-09-29); crates/lights/src/image.rs:408-411 (RasterLayer { premultiplied, coverage }, both FloatImage<T>); crates/lights/src/numerics/vector.rs:16 (Rgb<T> = Vec3<T>)"
why = "RasterLayer holds two FloatImage planes, and FloatImage is Vec<Rgb<T>> with Rgb a Vec3, so 24 B per pixel at f32 and 48 at f64. At 1920x1080 that is 47.46 MiB and 94.92 MiB. The coverage plane carries a SCALAR - draw.rs:430 writes Rgb::splat(covered) - so 8 of its 12 bytes per pixel at f32 hold no information: 15.82 MiB of redundancy per surface, computed 2026-09-29, not measured on a run."
next = "FIX. Give the coverage plane a scalar type of its own rather than a splatted Rgb, and keep every read site honest by making the change at the type level so the compiler finds them. CLOSE BAR: resident bytes for a 1920x1080 RasterLayer at f32 falls from 49,766,400 to 33,177,600 in a test that asserts the figure, plus a regression test seen RED on the unfixed tree that pins the byte count, and no pixel changes anywhere in the suite (the whole existing draw_list and agreement arms must be bit-identical). WATCH: RasterLayer is public and from_coverage8, over and the fit arm all touch it, so this is an API change and its blast radius is the reason it is filed rather than done in passing. ITS TEST IS ALREADY WRITTEN AND PARKED, 2026-09-30. A context wrote the regression test test-first and saw it red, then ended on BUDGET SPENT before building the change, leaving it uncommitted. Rather than lose the expensive half, it is saved as docs/lights/parked/l177_coverage_plane_test.patch and `git apply` of that patch is the FIRST act of this entry: confirm it is still red, then build the scalar plane. The test is tests/image.rs::a_coverage_plane_holds_one_scalar_per_pixel_so_a_1080p_f32_layer_is_33_177_600_bytes, and it asserts the byte count AND the allocation count of each plane size that from_coverage8 and Framebuffer::resolve_premultiplied make, so a fix that halves the bytes by allocating twice does not pass. WHY IT WAS PARKED rather than carried: it broke feature detachability in both method-alone builds, and the first public commit of a crate whose thesis is measurement should pass its own suite rather than ship a known red. Nothing about the test is wrong. BLAST RADIUS, measured 2026-09-30: 41 references to `.coverage` across 13 files, the heaviest tests/draw_list.rs 9, tests/interpenetration.rs 6, tests/primitive_pass.rs 5, plus src/image.rs, src/draw.rs and two binaries. It is a public API change, which is why it is filed rather than done in passing."
