[[decision]]
id = "ADR-001"
title = "Binary deployment via dlopen"
group = "forge"
question = "How should forge deliver compiled code to nexus for thread-safe execution?"
options = ["JIT lifetime coordination", "Dynamic loading via dlopen", "Shared memory IPC"]
chosen = "Dynamic loading via dlopen"
reason = "Function pointers do NOT survive JIT disposal (SEGFAULT in R1); dlopen keeps code alive automatically; standard toolchain approach validated by R3 (480-byte object files)"
status = "Accepted"
date = "2025-10-24"
affects = ["forge", "nexus", "metadata"]

[[decision]]
id = "ADR-002"
title = "Compositional executor via strategy pattern"
group = "nexus"
question = "How should execution behavior be decomposed — fixed executor types or composable strategies?"
options = ["Monolithic executor (ThreadExecutor, ProcessExecutor, RemoteExecutor)", "Strategy pattern with hot-swap", "Plugin-based architecture"]
chosen = "Strategy pattern with hot-swap"
reason = "Avoids combinatorial explosion (3x3x3=27 fixed types vs O(n) strategies); validated by NVIDIA HMM, CUDA Unified Memory, AMD HSA, Microsoft TPL Dataflow; enables runtime strategy swapping"
status = "Accepted"
date = "2025-10-24"
affects = ["nexus", "B.4-B.7"]

[[decision]]
id = "ADR-003"
title = "B.4-B.7 compositional architecture summary"
group = "nexus"
question = "Was the compositional executor architecture validated through experimentation?"
options = ["Continue with design", "Redesign based on findings"]
chosen = "Continue with design"
reason = "4500 lines, ~100 tests in 6.5 hours; industry-validated against 5 production systems; runtime strategy swapping proven with cooperative message protocol"
status = "Validated"
date = "2025-10-25"
affects = ["nexus", "B.4-B.7", "B.8"]

[[decision]]
id = "ADR-004"
title = "Defer comprehensive benchmarking to B.12"
group = "nexus"
question = "When should comprehensive benchmarking be performed — now or after all features?"
options = ["Benchmark now (incomplete picture)", "Defer to B.12 after all features"]
chosen = "Defer to B.12 after all features"
reason = "Benchmarking fragments gives incomplete picture; consistent with 'measure complete system, not fragments' philosophy; B.12 follows B.9 so all features are available"
status = "Accepted"
date = "2025-10-25"
affects = ["nexus", "B.12"]

[[decision]]
id = "ADR-005"
title = "Milestone ordering: B.10 → B.11 → B.9 → B.12"
group = "nexus"
question = "What sequence should remaining experiments follow after B.4-B.8?"
options = ["Original: B.9 → B.10 → B.11 → B.12", "Reordered: B.10 → B.11 → B.9 → B.12"]
chosen = "Reordered: B.10 → B.11 → B.9 → B.12"
reason = "B.10 is foundational ('the rock on which everything else is built'); remote debugging requires remote executors (B.11 before B.9); debugging needs something to debug; benchmark complete system last"
status = "Accepted"
date = "2025-10-27"
affects = ["nexus", "B.10", "B.11", "B.9", "B.12"]

[[decision]]
id = "DEC-debug"
title = "Debugging is separate, not a mode of production"
group = "nexus"
question = "Should debugging be integrated into production orchestrators or be a separate tier?"
options = ["Add debug flags to production orchestrators", "Separate DebugOrchestrator tier"]
chosen = "Separate DebugOrchestrator tier"
reason = "'Debugging not supposed to be resilient nor fast' — it has fundamentally different requirements; builds debugging INTO the execution engine instead of relying on external debugger (GDB/LLDB)"
status = "Accepted"
date = "2025-10-27"
affects = ["nexus", "B.9"]

[[decision]]
id = "DEC-methodology"
title = "Methodology v2.0 — Elephant Parable"
group = "teaching"
question = "What teaching methodology balances structured learning with engagement?"
options = ["Gamification-primary", "TODO-driven with gamification background", "No gamification"]
chosen = "TODO-driven with gamification background"
reason = "Gamification-primary was abandoned as wrong for thoughtful work; Socratic method + Musashi Five Rings + background gamification; Elephant Parable (architect sees shape, Claude feels texture) captures the collaboration model"
status = "Accepted"
date = "2025-11-15"
affects = ["teaching"]

[[decision]]
id = "DEC-structural-semantic"
title = "Structural vs semantic problem classification"
group = "forge"
question = "Should bridge code be generated for all cross-language calls or only semantic mismatches?"
options = ["Generate bridges for everything", "Only for semantic mismatches"]
chosen = "Only for semantic mismatches"
reason = "62x better performance because most calls don't need bridges — only generate when there's a genuine type system mismatch (e.g., struct layout, calling convention); structural matches pass through directly"
status = "Accepted"
date = "2025-10-24"
affects = ["forge", "bridge_gen"]

[[decision]]
id = "DEC-atrium-redesign"
title = "Three-layer visualization framework"
group = "atrium"
question = "How should atrium visualize the project — single graph or multi-layer framework?"
options = ["Single graph view", "Three layers (Organization/Design/Runtime) with Isolation/Unified Effort duality"]
chosen = "Three layers (Organization/Design/Runtime) with Isolation/Unified Effort duality"
reason = "Validated by Conway's Law, Viable System Model, Team Topologies, adjoint functors; drops 181s Sugiyama startup to <3s; same infrastructure serves all three layers with different data sources"
status = "Accepted"
date = "2026-03-22"
affects = ["atrium", "M1", "M2", "M3", "M4", "M5"]

